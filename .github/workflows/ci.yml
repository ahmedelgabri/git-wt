name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: NixOS/nix-installer-action@main

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Check formatting
        run: nix develop --command just fmt-check

      - name: Go vet
        run: nix develop --command just vet

      - name: Staticcheck
        run: nix develop --command just staticcheck

      - name: Check workflow definitions
        run: nix develop --command actionlint

      - name: Check reachable vulnerabilities
        run: nix develop --command just govulncheck

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: NixOS/nix-installer-action@main

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Use Git from the project dependencies
        run: |
          nix build --inputs-from . "nixpkgs#git" --out-link "$RUNNER_TEMP/git-current"
          echo "$RUNNER_TEMP/git-current/bin" >> "$GITHUB_PATH"

      - name: Read Go minor version from go.mod
        id: go-version
        run: |
          awk '$1 == "go" { split($2, v, "."); print "version=" v[1] "." v[2] ".x" }' go.mod >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          check-latest: true

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Install bats
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y bats zlib1g-dev
          else
            brew install bats-core
          fi

      - name: Build older Git for rejection tests
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error \
            https://www.kernel.org/pub/software/scm/git/git-2.38.0.tar.xz \
            -o git-2.38.0.tar.xz
          echo "923eade26b1814de78d06bda8e0a9f5da8b7c4b304b3f9050ffb464f0310320a  git-2.38.0.tar.xz" | shasum -a 256 -c -
          tar xf git-2.38.0.tar.xz
          make -C git-2.38.0 -j2 NO_CURL=YesPlease NO_EXPAT=YesPlease \
            NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_OPENSSL=YesPlease git
          echo "GIT_WT_OLD_GIT=$RUNNER_TEMP/git-2.38.0/git" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: just test

      - name: Run race tests
        run: just test-race

      - name: Run E2E tests
        run: just test-e2e

  build:
    name: Build (Nix)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: NixOS/nix-installer-action@main

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Check flake
        run: nix flake check

      - name: Build package
        run: nix build

      - name: Test executable runs
        run: ./result/bin/git-wt --help
